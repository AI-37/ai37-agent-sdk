name: publish · @ai37/agent-sdk (npm)

# Публикация TS-ядра @ai37/agent-sdk (packages/ts) в приватный Verdaccio (npm.app.sp-ai.ru).
# Версия берётся из packages/ts/package.json — publish это осознанное ручное действие.
# Повторная публикация той же версии естественно падает (реестр отвергает существующую версию).
#
# Аутентификация = HTTP Basic через .npmrc в корне репо (коммитится): //npm.app.sp-ai.ru/:_auth=${AI37_NPM_TOKEN}.
# У Verdaccio max_users:-1 → npm login/токены не работают, только _auth (base64 user:pass).
#
# Требуемый секрет репозитория:
#   AI37_NPM_TOKEN — base64("ci-publish:<пароль>") для _auth издателя (право publish на scope @ai37).
#
# Раннер выбирается инпутом: ubuntu-latest (дефолт) или self-hosted ai37-local-1
# (например когда исчерпаны минуты GitHub-hosted). Trusted publishing (OIDC) для npm
# не используется намеренно — он не поддерживает self-hosted раннеры.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for publish job
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ai37-self-hosted
      dry_run:
        description: Dry run (сборка + валидация, без заливки в npm)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publish-ts-${{ github.ref }}
  cancel-in-progress: false        # publish нельзя отменять на лету

jobs:
  publish:
    name: npm publish · @ai37/agent-sdk
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # registry-url не задаём: используем закоммиченный .npmrc в корне репо (Verdaccio + _auth)
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - run: npm ci
      # prepublishOnly → npm run verify (tsc --noEmit + vitest + tsup) выполнится на publish
      # автоматически, в т.ч. при --dry-run → dry-run это полноценный gate (сборка+тесты), без заливки.
      - name: publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run
        env:
          AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
      - name: publish
        if: ${{ !inputs.dry_run }}
        run: npm publish
        env:
          AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
