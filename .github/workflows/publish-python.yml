name: publish · ai37-agent-sdk (PyPI)

# Публикация Python-ядра ai37-agent-sdk (packages/python) в приватный PyPI (pypi.app.sp-ai.ru)
# через poetry build + twine upload.
# Версия берётся из packages/python/pyproject.toml. Повторная публикация той же версии падает.
# У Python нет аналога npm prepublishOnly, поэтому верификацию (ruff/mypy/pytest) гоняем явно —
# паритет с TS-гейтом.
#
# Аутентификация = HTTP Basic (TWINE_USERNAME=ci-publish, TWINE_PASSWORD=${AI37_PYPI_TOKEN}).
#
# Требуемый секрет репозитория:
#   AI37_PYPI_TOKEN — пароль pypi-юзера ci-publish; прокидывается как TWINE_PASSWORD.
#
# Раннер выбирается инпутом: ubuntu-latest (дефолт) или self-hosted ai37-local-1.

on:
  # Раннер (канон AI-37): ручной запуск с runner=ubuntu-latest или ai37-self-hosted выбирает
  # явно; auto и автозапуск берут переменную организации CD_RUNNER — раннер деплоя и публикации (CD),
  # JSON-массив меток, напр. ["self-hosted","ai37-local-1"]; без неё — ubuntu-24.04.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: auto = переменная CD_RUNNER, иначе ubuntu-24.04"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - ubuntu-latest
          - ai37-self-hosted
      dry_run:
        description: Dry run (сборка + валидация, без заливки в PyPI)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false        # publish нельзя отменять на лету

jobs:
  publish:
    name: PyPI publish · ai37-agent-sdk
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CD_RUNNER && fromJSON(vars.CD_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # единый источник версии рантайма — packages/python/.python-version (как локально через pyenv)
          python-version-file: packages/python/.python-version
      # Poetry — официальным установщиком (install.python-poetry.org), версия = та, что сгенерировала
      # poetry.lock. POETRY_HOME в runner.temp: каталог чистится после каждой джобы, поэтому на
      # self-hosted раннере ничего не копится в ~/.local и не ломается, когда из toolcache удаляют
      # Python, на котором был поставлен инструмент (так сломался прежний `pipx install poetry`).
      # Ставится после setup-python, на его Python.
      - name: install poetry
        shell: bash
        timeout-minutes: 10
        env:
          POETRY_HOME: ${{ runner.temp }}/poetry
          POETRY_VERSION: 2.3.2
        # Сеть раннера иногда залипает (30.10 curl висел 5 минут, джоба ушла в таймаут). Поэтому у curl
        # таймауты и повторы, а установку целиком (сам установщик качает Poetry с PyPI) повторяем до
        # трёх раз. Скрипт сохраняется в файл: упавший curl не превратится в «успешный» пустой скрипт.
        run: |
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -o "$RUNNER_TEMP/install-poetry.py" https://install.python-poetry.org \
              && python3 "$RUNNER_TEMP/install-poetry.py" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "::warning::Poetry: попытка $attempt не удалась, повторяю"
            rm -rf "$POETRY_HOME"; sleep 15
          done
          echo "$POETRY_HOME/bin" >> "$GITHUB_PATH"
      - name: install deps
        run: poetry install --with dev --no-interaction
      - name: verify (ruff + mypy + pytest)
        run: |
          poetry run ruff check .
          poetry run mypy src
          poetry run pytest
      # twine — pip-ом в Python из setup-python, а не через pipx: pipx self-hosted раннера живёт на
      # Python хоста и ломается вместе с ним (как прежний `pipx install poetry`).
      - name: install twine
        run: python -m pip install twine
      - name: build
        run: poetry build --no-interaction
      - name: publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: twine check dist/*
      - name: publish to private PyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: ci-publish
          TWINE_PASSWORD: ${{ secrets.AI37_PYPI_TOKEN }}
        run: twine upload --repository-url https://pypi.app.sp-ai.ru/ dist/*
