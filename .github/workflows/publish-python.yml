name: publish · ai37-agent-sdk (PyPI)

# Публикация Python-ядра ai37-agent-sdk (packages/python) в приватный PyPI (pypi.app.sp-ai.ru)
# через poetry build + twine upload.
# Версия берётся из packages/python/pyproject.toml. Повторная публикация той же версии падает.
# У Python нет аналога npm prepublishOnly, поэтому верификацию (ruff/mypy/pytest) гоняем явно —
# паритет с TS-гейтом.
#
# Аутентификация = HTTP Basic (TWINE_USERNAME=ci-publish, TWINE_PASSWORD=${AI37_PYPI_TOKEN}).
#
# Требуемый секрет репозитория:
#   AI37_PYPI_TOKEN — пароль pypi-юзера ci-publish; прокидывается как TWINE_PASSWORD.
#
# Раннер выбирается инпутом: ubuntu-latest (дефолт) или self-hosted ai37-local-1.

on:
  # Раннер (канон AI-37): ручной запуск с runner=ubuntu-latest или ai37-self-hosted выбирает
  # явно; auto и автозапуск берут переменную организации CD_RUNNER — раннер деплоя и публикации (CD),
  # JSON-массив меток, напр. ["self-hosted","ai37-local-1"]; без неё — ubuntu-latest.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: auto = переменная CD_RUNNER, иначе ubuntu-latest"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - ubuntu-latest
          - ai37-self-hosted
      dry_run:
        description: Dry run (сборка + валидация, без заливки в PyPI)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false        # publish нельзя отменять на лету

jobs:
  publish:
    name: PyPI publish · ai37-agent-sdk
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CD_RUNNER && fromJSON(vars.CD_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # единый источник версии рантайма — packages/python/.python-version (как локально через pyenv)
          python-version-file: packages/python/.python-version
      - name: install poetry
        run: pipx install poetry
      - name: install deps
        run: poetry install --with dev --no-interaction
      - name: verify (ruff + mypy + pytest)
        run: |
          poetry run ruff check .
          poetry run mypy src
          poetry run pytest
      - name: install twine
        run: pipx install twine
      - name: build
        run: poetry build --no-interaction
      - name: publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: twine check dist/*
      - name: publish to private PyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: ci-publish
          TWINE_PASSWORD: ${{ secrets.AI37_PYPI_TOKEN }}
        run: twine upload --repository-url https://pypi.app.sp-ai.ru/ dist/*
