name: publish · ai37-capture-contract (PyPI)

# Публикация контракта захвата ai37-capture-contract (packages/capture-contract) в приватный PyPI
# (pypi.app.sp-ai.ru) через poetry build + twine upload — зеркало publish-python.yml.
# Версия берётся из packages/capture-contract/pyproject.toml. Повторная публикация той же версии
# падает: уже выложенную версию индекс не перезаписывает.
#
# Аутентификация = HTTP Basic (TWINE_USERNAME=ci-publish, TWINE_PASSWORD=${AI37_PYPI_TOKEN}).
#
# Требуемый секрет репозитория:
#   AI37_PYPI_TOKEN — пароль pypi-юзера ci-publish; прокидывается как TWINE_PASSWORD.
#
# Раннер выбирается инпутом: ubuntu-latest (дефолт) или self-hosted ai37-local-1.

on:
  # Раннер (канон AI-37): ручной запуск с runner=ubuntu-latest или ai37-self-hosted выбирает
  # явно; auto и автозапуск берут переменную организации CD_RUNNER — раннер деплоя и публикации (CD),
  # JSON-массив меток, напр. ["self-hosted","ai37-local-1"]; без неё — ubuntu-latest.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: auto = переменная CD_RUNNER, иначе ubuntu-latest"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - ubuntu-latest
          - ai37-self-hosted
      dry_run:
        description: Dry run (сборка + валидация, без заливки в PyPI)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publish-capture-contract-${{ github.ref }}
  cancel-in-progress: false        # publish нельзя отменять на лету

jobs:
  publish:
    name: PyPI publish · ai37-capture-contract
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CD_RUNNER && fromJSON(vars.CD_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/capture-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # единый источник версии рантайма — packages/capture-contract/.python-version
          python-version-file: packages/capture-contract/.python-version
      # Poetry — официальным установщиком (install.python-poetry.org), версия = та, что сгенерировала
      # poetry.lock. POETRY_HOME в runner.temp: каталог чистится после каждой джобы, поэтому на
      # self-hosted раннере ничего не копится в ~/.local и не ломается, когда из toolcache удаляют
      # Python, на котором был поставлен инструмент (так сломался прежний `pipx install poetry`).
      # Ставится после setup-python, на его Python.
      - name: install poetry
        shell: bash
        timeout-minutes: 10
        env:
          POETRY_HOME: ${{ runner.temp }}/poetry
          POETRY_VERSION: 2.3.2
        # Сеть раннера иногда залипает (30.10 curl висел 5 минут, джоба ушла в таймаут). Поэтому у curl
        # таймауты и повторы, а установку целиком повторяем до трёх раз. Установщик сам качает Poetry с
        # PyPI, и запрос метаданных у него без таймаута, поэтому он ограничен `timeout 180`. Скрипт
        # сохраняется в файл: упавший curl не превратится в «успешный» пустой скрипт.
        run: |
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -o "$RUNNER_TEMP/install-poetry.py" https://install.python-poetry.org \
              && timeout 180 python3 "$RUNNER_TEMP/install-poetry.py" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "::warning::Poetry: попытка $attempt не удалась, повторяю"
            rm -rf "$POETRY_HOME"; sleep 15
          done
          echo "$POETRY_HOME/bin" >> "$GITHUB_PATH"
      - name: install deps
        run: poetry install --with dev --no-interaction
      - name: verify (ruff + mypy + pytest)
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy src
          poetry run pytest
      # twine — pip-ом в Python из setup-python, а не через pipx: pipx self-hosted раннера живёт на
      # Python хоста и ломается вместе с ним (как прежний `pipx install poetry`).
      - name: install twine
        run: python -m pip install twine
      - name: build
        run: poetry build --no-interaction
      - name: publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: twine check dist/*
      - name: publish to private PyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: ci-publish
          TWINE_PASSWORD: ${{ secrets.AI37_PYPI_TOKEN }}
        run: twine upload --repository-url https://pypi.app.sp-ai.ru/ dist/*
