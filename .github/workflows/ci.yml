name: ci

on:
  pull_request:
  # Раннер (канон AI-37): ручной запуск с runner=ubuntu-latest или ai37-self-hosted выбирает
  # явно; auto и автозапуск берут переменную организации CI_RUNNER — раннер тестов (CI),
  # JSON-массив меток, напр. ["self-hosted","ai37-local-1"]; без неё — ubuntu-24.04.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: auto = переменная CI_RUNNER, иначе ubuntu-24.04"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - ubuntu-latest
          - ai37-self-hosted

# Отменять предыдущий прогон на той же ветке/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Одна джоба: раннер подбирает прогон один раз, и PR разблокируется сразу после последнего шага.
  # Отдельные джобы на пакет и агрегатор вставали на единственном self-hosted раннере в очередь за
  # чужими джобами и держали PR красным уже после зелёных проверок. Имя ci-green — единое для всех
  # репозиториев AI-37 и обязательная проверка ruleset (docs/plans/doc-bot-pr-review.md).
  # Пакеты проверяются по очереди и независимо: шаги пакета ждут только его установки
  # (steps.<id>.outcome), так что упавший пакет не прячет результаты остальных, а джоба всё
  # равно красная, если упал любой шаг.
  ci-green:
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    # @ai37/a2ui-catalog-schemas (зависимость @ai37/agent-host) тянется из приватного Verdaccio
    # (npm.app.sp-ai.ru): корневой .npmrc берёт _auth из ${AI37_NPM_TOKEN}.
    env:
      AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
    # Живой Postgres 18 (как managed PG в проде) — общий для обоих хостов: test/task-store.pg.test.ts (@ai37/agent-host) создаёт
    # себе временные базы (нужен суперпользователь сервиса), tests/test_postgres_task_store.py
    # (ai37-agent-host) работает в базе a2a. Пакеты идут по очереди и друг другу не мешают.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: a2a
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          # Кэш npm в GitHub Actions — только на hosted. На self-hosted ~/.npm и так переживает прогоны,
          # а выгрузка кэша в post-step шла ~85 с на прогон и однажды висела до таймаута джобы.
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            packages/ts-docx/package-lock.json
            packages/ts/package-lock.json
            packages/ts-host/package-lock.json

      # ───────────────────────── @ai37/docx (TS) ─────────────────────────
      - name: ts · @ai37/docx · install
        id: ts-docx
        working-directory: packages/ts-docx
        run: npm ci
      - name: ts · @ai37/docx · lint
        if: ${{ !cancelled() && steps.ts-docx.outcome == 'success' }}
        working-directory: packages/ts-docx
        run: npm run lint
      - name: ts · @ai37/docx · test
        if: ${{ !cancelled() && steps.ts-docx.outcome == 'success' }}
        working-directory: packages/ts-docx
        run: npm test
      - name: ts · @ai37/docx · build
        if: ${{ !cancelled() && steps.ts-docx.outcome == 'success' }}
        working-directory: packages/ts-docx
        run: npm run build

      # ───────────────────────── @ai37/agent-sdk (TS, ядро) ─────────────────────────
      - name: ts · @ai37/agent-sdk · install
        id: ts
        if: ${{ !cancelled() }}
        working-directory: packages/ts
        run: npm ci
      - name: ts · @ai37/agent-sdk · lint
        if: ${{ !cancelled() && steps.ts.outcome == 'success' }}
        working-directory: packages/ts
        run: npm run lint   # tsc --noEmit
      - name: ts · @ai37/agent-sdk · test
        if: ${{ !cancelled() && steps.ts.outcome == 'success' }}
        working-directory: packages/ts
        run: npm test       # vitest run
      # Его dist нужен @ai37/agent-host (file:../ts).
      - name: ts · @ai37/agent-sdk · build
        id: ts-build
        if: ${{ !cancelled() && steps.ts.outcome == 'success' }}
        working-directory: packages/ts
        run: npm run build  # tsup

      # ───────────────────────── @ai37/agent-host (TS) ─────────────────────────
      # Зависит от @ai37/agent-sdk (file:../ts) — собранного шагом выше. NPM_CONFIG_USERCONFIG грузит
      # корневой .npmrc (как в publish-ts-host.yml) для всех следующих шагов: остальным пакетам он не
      # мешает — пинит только scope @ai37.
      - name: ts · @ai37/agent-host · private npm registry
        if: ${{ !cancelled() }}
        run: echo "NPM_CONFIG_USERCONFIG=$GITHUB_WORKSPACE/.npmrc" >> "$GITHUB_ENV"
      - name: ts · @ai37/agent-host · install
        id: ts-host
        if: ${{ !cancelled() && steps.ts-build.outcome == 'success' }}
        working-directory: packages/ts-host
        run: npm ci
      - name: ts · @ai37/agent-host · lint
        if: ${{ !cancelled() && steps.ts-host.outcome == 'success' }}
        working-directory: packages/ts-host
        run: npm run lint
      - name: ts · @ai37/agent-host · format DSH adapter
        if: ${{ !cancelled() && steps.ts-host.outcome == 'success' }}
        working-directory: packages/ts-host
        run: npm run format:dsh:check
      - name: ts · @ai37/agent-host · test
        if: ${{ !cancelled() && steps.ts-host.outcome == 'success' }}
        working-directory: packages/ts-host
        run: npm test
        env:
          # job-контекст (порт сервиса) доступен только на уровне шага, не в jobs.<id>.env.
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/a2a
          # Без базы Postgres-тесты молча пропустились бы; в CI это ошибка.
          REQUIRE_TEST_DATABASE: '1'
      - name: ts · @ai37/agent-host · build
        id: ts-host-build
        if: ${{ !cancelled() && steps.ts-host.outcome == 'success' }}
        working-directory: packages/ts-host
        run: npm run build
      - name: ts · @ai37/agent-host · packed DSH and root imports
        if: ${{ !cancelled() && steps.ts-host-build.outcome == 'success' }}
        working-directory: packages/ts-host
        run: npm run test:package

      # ───────────────────────── Python ─────────────────────────
      # Каждый пакет — на своём Python из packages/<пакет>/.python-version (как локально через pyenv):
      # перед установкой пакета — свой setup-python. `poetry env use python` берёт интерпретатор,
      # который сейчас первый в PATH, — то есть последний поставленный setup-python.
      - uses: actions/setup-python@v6
        id: py
        if: ${{ !cancelled() }}
        with:
          python-version-file: packages/python/.python-version
      # Poetry — официальным установщиком (install.python-poetry.org), версия = та, что сгенерировала
      # poetry.lock (у всех трёх пакетов 2.3.2). POETRY_HOME в runner.temp: каталог чистится после
      # каждой джобы, поэтому на self-hosted раннере ничего не копится в ~/.local и не ломается, когда
      # из toolcache удаляют Python, на котором был поставлен инструмент (так сломался прежний
      # `pipx install poetry`). Ставится после первого setup-python, на его Python; окружение каждого
      # пакета poetry создаёт на Python из его setup-python (`poetry env use python`).
      - name: install poetry
        id: poetry
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        shell: bash
        timeout-minutes: 10
        env:
          POETRY_HOME: ${{ runner.temp }}/poetry
          POETRY_VERSION: 2.3.2
        # Сеть раннера иногда залипает (30.10 curl висел 5 минут, джоба ушла в таймаут). Поэтому у curl
        # таймауты и повторы, а установку целиком повторяем до трёх раз. Установщик сам качает Poetry с
        # PyPI, и запрос метаданных у него без таймаута, поэтому он ограничен `timeout 180`. Скрипт
        # сохраняется в файл: упавший curl не превратится в «успешный» пустой скрипт.
        run: |
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -o "$RUNNER_TEMP/install-poetry.py" https://install.python-poetry.org \
              && timeout 180 python3 "$RUNNER_TEMP/install-poetry.py" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "::warning::Poetry: попытка $attempt не удалась, повторяю"
            rm -rf "$POETRY_HOME"; sleep 15
          done
          echo "$POETRY_HOME/bin" >> "$GITHUB_PATH"

      # ───────────────────────── ai37-agent-sdk (Python) ─────────────────────────
      - name: py · ai37-agent-sdk · install
        id: python
        if: ${{ !cancelled() && steps.poetry.outcome == 'success' }}
        working-directory: packages/python
        run: poetry env use python && poetry install --with dev --no-interaction
      - name: py · ai37-agent-sdk · ruff
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        working-directory: packages/python
        run: poetry run ruff check .
      - name: py · ai37-agent-sdk · mypy
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        working-directory: packages/python
        run: poetry run mypy src
      - name: py · ai37-agent-sdk · pytest
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        working-directory: packages/python
        run: poetry run pytest

      # ───────────────────────── ai37-agent-host (Python) ─────────────────────────
      # Зависит от ai37-agent-sdk версионным ограничением (не path) — poetry install тянет
      # опубликованный SDK с PyPI, сиблинг собирать не нужно.
      - uses: actions/setup-python@v6
        id: py-host
        if: ${{ !cancelled() && steps.poetry.outcome == 'success' }}
        with:
          # единый источник версии — packages/python-host/.python-version (как локально через pyenv)
          python-version-file: packages/python-host/.python-version
      - name: py · ai37-agent-host · install
        id: python-host
        if: ${{ !cancelled() && steps.py-host.outcome == 'success' }}
        working-directory: packages/python-host
        run: poetry env use python && poetry install --with dev --no-interaction
      - name: py · ai37-agent-host · ruff
        if: ${{ !cancelled() && steps.python-host.outcome == 'success' }}
        working-directory: packages/python-host
        run: poetry run ruff check .
      - name: py · ai37-agent-host · mypy
        if: ${{ !cancelled() && steps.python-host.outcome == 'success' }}
        working-directory: packages/python-host
        run: poetry run mypy src
      - name: py · ai37-agent-host · pytest
        if: ${{ !cancelled() && steps.python-host.outcome == 'success' }}
        working-directory: packages/python-host
        run: poetry run pytest
        env:
          # Живой Postgres для tests/test_postgres_task_store.py (без него эти тесты идут только на SQLite).
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/a2a

      # ───────────────────────── ai37-capture-contract (Python) ─────────────────────────
      - uses: actions/setup-python@v6
        id: py-capture
        if: ${{ !cancelled() && steps.poetry.outcome == 'success' }}
        with:
          # единый источник версии — packages/capture-contract/.python-version
          python-version-file: packages/capture-contract/.python-version
      - name: py · ai37-capture-contract · install
        id: capture-contract
        if: ${{ !cancelled() && steps.py-capture.outcome == 'success' }}
        working-directory: packages/capture-contract
        run: poetry env use python && poetry install --with dev --no-interaction
      - name: py · ai37-capture-contract · ruff
        if: ${{ !cancelled() && steps.capture-contract.outcome == 'success' }}
        working-directory: packages/capture-contract
        run: poetry run ruff check .
      - name: py · ai37-capture-contract · ruff format
        if: ${{ !cancelled() && steps.capture-contract.outcome == 'success' }}
        working-directory: packages/capture-contract
        run: poetry run ruff format --check .
      - name: py · ai37-capture-contract · mypy
        if: ${{ !cancelled() && steps.capture-contract.outcome == 'success' }}
        working-directory: packages/capture-contract
        run: poetry run mypy src
      - name: py · ai37-capture-contract · pytest
        if: ${{ !cancelled() && steps.capture-contract.outcome == 'success' }}
        working-directory: packages/capture-contract
        run: poetry run pytest

      # ───────────────────────── codegen parity ─────────────────────────
      # codes.ts / codes.py должны соответствовать contract/feature-codes.json. Последним: генератор
      # переписывает файлы в рабочем дереве, пакеты выше проверяются на закоммиченных.
      - name: codegen parity · generate
        id: codegen
        if: ${{ !cancelled() }}
        run: node scripts/codegen.mjs
      - name: codegen parity · no diff
        if: ${{ !cancelled() && steps.codegen.outcome == 'success' }}
        run: |
          git diff --exit-code -- \
            packages/ts/src/codes.ts \
            packages/python/src/ai37_agent_sdk/codes.py \
          || (echo "::error::codes.* рассинхронизированы с contract/ — запустите make codegen и закоммитьте" && exit 1)
