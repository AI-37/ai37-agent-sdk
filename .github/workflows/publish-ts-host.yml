name: publish · @ai37/agent-host (npm)

# Публикация TS-хоста @ai37/agent-host (packages/ts-host) в приватный Verdaccio (npm.app.sp-ai.ru).
# Зависит от @ai37/agent-sdk (file:../ts): его prepublishOnly → tsc --noEmit резолвит типы
# @ai37/agent-sdk из ../ts/dist, поэтому packages/ts надо собрать ПЕРВЫМ (как в ci.yml).
# Версия берётся из packages/ts-host/package.json. Повторная публикация той же версии падает.
#
# Аутентификация = HTTP Basic через .npmrc в корне репо (коммитится): //npm.app.sp-ai.ru/:_auth=${AI37_NPM_TOKEN}.
# У Verdaccio max_users:-1 → npm login/токены не работают, только _auth (base64 user:pass).
#
# ВАЖНО: publish выполняется в working-directory packages/ts-host (там package.json+package-lock.json),
# поэтому npm берёт project-.npmrc из localPrefix=packages/ts-host и КОРНЕВОЙ .npmrc НЕ читает → ENEEDAUTH.
# Лечим через NPM_CONFIG_USERCONFIG=<корень>/.npmrc: грузим корневой .npmrc как user-config
# независимо от cwd (единственный источник правды не дублируем в подпакеты).
#
# Требуемый секрет репозитория:
#   AI37_NPM_TOKEN — base64("ci-publish:<пароль>") для _auth издателя (право publish на scope @ai37).
#
# Раннер выбирается инпутом: ubuntu-latest (дефолт) или self-hosted ai37-local-1.

on:
  # Раннер (канон AI-37): ручной запуск с runner=ubuntu-latest или ai37-self-hosted выбирает
  # явно; auto и автозапуск берут переменную организации CD_RUNNER — раннер деплоя и публикации (CD),
  # JSON-массив меток, напр. ["self-hosted","ai37-local-1"]; без неё — ubuntu-latest.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: auto = переменная CD_RUNNER, иначе ubuntu-latest"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - ubuntu-latest
          - ai37-self-hosted
      dry_run:
        description: Dry run (сборка + валидация, без заливки в npm)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publish-ts-host-${{ github.ref }}
  cancel-in-progress: false        # publish нельзя отменять на лету

jobs:
  publish:
    name: npm publish · @ai37/agent-host
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CD_RUNNER && fromJSON(vars.CD_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    # agent-host тянет @ai37/a2ui-catalog-schemas и @ai37/agent-sdk из Verdaccio, поэтому
    # приватный .npmrc нужен ВСЕМ шагам (в т.ч. npm ci), а не только publish → задаём env на
    # уровне job: NPM_CONFIG_USERCONFIG грузит корневой .npmrc (см. шапку), AI37_NPM_TOKEN
    # подставляется в его _auth.
    env:
      AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # registry-url не задаём: используем закоммиченный .npmrc в корне репо (Verdaccio + _auth)
          cache: npm
          cache-dependency-path: |
            packages/ts/package-lock.json
            packages/ts-host/package-lock.json
      - name: build @ai37/agent-sdk (зависимость)
        working-directory: packages/ts
        run: npm ci && npm run build
      - name: install @ai37/agent-host
        working-directory: packages/ts-host
        run: npm ci
      # prepublishOnly → npm run verify (tsc --noEmit + vitest + tsup) сработает на publish, в т.ч. --dry-run.
      # dist-tag из версии: пререлиз (0.1.0-alpha.N) → `alpha`, релиз (0.2.0) → `latest`. Иначе релиз,
      # опубликованный с `--tag alpha`, не стал бы `latest`, и `npm install` без версии ставил бы старую альфу.
      - name: dist-tag
        id: disttag
        working-directory: packages/ts-host
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in *-*) tag=alpha ;; *) tag=latest ;; esac
          echo "version=$version → dist-tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: publish (dry-run)
        if: ${{ inputs.dry_run }}
        working-directory: packages/ts-host
        run: npm publish --tag ${{ steps.disttag.outputs.tag }} --dry-run
      - name: publish
        if: ${{ !inputs.dry_run }}
        working-directory: packages/ts-host
        run: npm publish --tag ${{ steps.disttag.outputs.tag }}
