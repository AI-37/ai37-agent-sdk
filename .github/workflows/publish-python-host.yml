name: publish · ai37-agent-host (PyPI)

# Публикация Python-хоста ai37-agent-host (packages/python-host) в приватный PyPI (pypi.app.sp-ai.ru)
# через poetry build + twine upload.
# Версия берётся из packages/python-host/pyproject.toml. Повторная публикация той же версии падает.
# Зависимость ai37-agent-sdk задана версионным ограничением (>=0.1.0a1,<0.2.0), не path — poetry
# install/build не требуют сиблинга (тянут опубликованный SDK). После миграции SDK живёт в
# приватном индексе, поэтому добавляем его как supplemental-источник poetry (публичный PyPI —
# основной), с HTTP-basic-кредами ci-read. Верификацию (ruff/mypy/pytest) гоняем явно — паритет
# с TS-гейтом (у Python нет аналога npm prepublishOnly).
#
# Аутентификация публикации = HTTP Basic (TWINE_USERNAME=ci-publish, TWINE_PASSWORD=${AI37_PYPI_TOKEN}).
#
# Требуемый секрет репозитория:
#   AI37_PYPI_TOKEN — пароль pypi-юзера ci-publish; он же (как read) — пароль ci-read для install.
#
# Раннер — по канону AI-37 (блок в `on:` ниже): auto → переменная CD_RUNNER → ubuntu-24.04;
# ручной запуск может явно выбрать ubuntu-latest или self-hosted ai37-local-1.

on:
  # Раннер (канон AI-37): ручной запуск с runner=ubuntu-latest или ai37-self-hosted выбирает
  # явно; auto и автозапуск берут переменную организации CD_RUNNER — раннер деплоя и публикации (CD),
  # JSON-массив меток, напр. ["self-hosted","ai37-local-1"]; без неё — ubuntu-24.04.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: auto = переменная CD_RUNNER, иначе ubuntu-24.04"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - ubuntu-latest
          - ai37-self-hosted
      dry_run:
        description: Dry run (сборка + валидация, без заливки в PyPI)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publish-python-host-${{ github.ref }}
  cancel-in-progress: false        # publish нельзя отменять на лету

jobs:
  publish:
    name: PyPI publish · ai37-agent-host
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CD_RUNNER && fromJSON(vars.CD_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/python-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # единый источник версии рантайма — packages/python-host/.python-version (как локально через pyenv)
          python-version-file: packages/python-host/.python-version
      # Poetry — официальным установщиком (install.python-poetry.org), версия = та, что сгенерировала
      # poetry.lock. POETRY_HOME в runner.temp: каталог чистится после каждой джобы, поэтому на
      # self-hosted раннере ничего не копится в ~/.local и не ломается, когда из toolcache удаляют
      # Python, на котором был поставлен инструмент (так сломался прежний `pipx install poetry`).
      # Ставится после setup-python, на его Python.
      - name: install poetry
        shell: bash  # bash -eo pipefail: упавший curl не превратится в «успешный» пустой скрипт
        env:
          POETRY_HOME: ${{ runner.temp }}/poetry
          POETRY_VERSION: 2.3.2
        run: |
          curl -fsSL https://install.python-poetry.org | python3 -
          echo "$POETRY_HOME/bin" >> "$GITHUB_PATH"
      # Приватный индекс ai37 объявлен в pyproject.toml ([[tool.poetry.source]]) и учтён в poetry.lock.
      # НЕ добавляем его в рантайме (`poetry source add` менял content-hash → lock рассинхронизировался).
      # Креды к приватному индексу — на install ниже (POETRY_HTTP_BASIC_AI37_*).
      - name: install deps
        env:
          POETRY_HTTP_BASIC_AI37_USERNAME: ci-read
          POETRY_HTTP_BASIC_AI37_PASSWORD: ${{ secrets.AI37_PYPI_TOKEN }}
        run: poetry install --with dev --no-interaction
      - name: verify (ruff + mypy + pytest)
        run: |
          poetry run ruff check .
          poetry run mypy src
          poetry run pytest
      # twine — pip-ом в Python из setup-python, а не через pipx: pipx self-hosted раннера живёт на
      # Python хоста и ломается вместе с ним (как прежний `pipx install poetry`).
      - name: install twine
        run: python -m pip install twine
      - name: build
        run: poetry build --no-interaction
      - name: publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: twine check dist/*
      - name: publish to private PyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: ci-publish
          TWINE_PASSWORD: ${{ secrets.AI37_PYPI_TOKEN }}
        run: twine upload --repository-url https://pypi.app.sp-ai.ru/ dist/*
